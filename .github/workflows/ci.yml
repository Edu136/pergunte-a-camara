name: CI

on:
  push:
  pull_request:

jobs:
  lint-e-testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências leves
        run: pip install fastapi httpx pydantic pydantic-settings sqlglot pandas "psycopg[binary]" plotly streamlit pytest ruff
      - name: Lint
        run: ruff check .
      - name: Testes
        run: pytest
