services:
  db:
    image: pgvector/pgvector:pg16
    container_name: camara-db
    environment:
      POSTGRES_USER: camara
      POSTGRES_PASSWORD: camara
      POSTGRES_DB: camara
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camara -d camara"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
